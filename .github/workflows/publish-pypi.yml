name: Publish Python package to PyPI

on:
  push:
    tags:
      - "v*"
      - "py-aikernel-net-*"
  workflow_dispatch:
    inputs:
      version:
        description: Exact Python distribution version to publish
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build aikernel-net
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tooling
        run: python -m pip install --upgrade build twine

      - name: Check requested version matches package metadata
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          python - <<'PY'
          import os, tomllib
          from packaging.version import Version
          actual = tomllib.load(open("pyproject.toml", "rb"))["project"]["version"]
          tag = os.environ.get("RELEASE_TAG", "")
          requested = os.environ.get("REQUESTED_VERSION") or tag.removeprefix("py-aikernel-net-").removeprefix("v")
          if not requested or Version(requested) != Version(actual):
              raise SystemExit(f"Refusing publication: requested={requested!r}, package={actual!r}")
          PY

      - name: Build distributions
        run: python -m build --wheel --outdir dist

      - name: Check distributions
        run: python -m twine check dist/*

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: pypi-dist-aikernel-net
          path: python/dist/*
          if-no-files-found: error

  publish:
    name: Publish aikernel-net
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: pypi-dist-aikernel-net
          path: dist

      - name: Show trusted publisher claims
        run: |
          echo "PyPI project: aikernel-net"
          echo "Expected owner: AIKernel-NET"
          echo "Expected repository: AIKernel.Core"
          echo "Expected workflow: publish-pypi.yml"
          echo "Expected environment: pypi"
          echo "Actual repository: ${GITHUB_REPOSITORY}"
          echo "Actual workflow ref: ${GITHUB_WORKFLOW_REF}"
          echo "Actual ref: ${GITHUB_REF}"

      - name: Publish distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
