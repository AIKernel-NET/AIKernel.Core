[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aikernel-cuda-driver"
version = "0.1.0"
description = "AIKernel Native C ABI with a dynamically loaded CUDA Driver backend"
requires-python = ">=3.9"
readme = "README.md"

[tool.setuptools]
package-dir = {"" = "python"}

[tool.setuptools.packages.find]
where = ["python"]
